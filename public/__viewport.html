<!doctype html>
<!-- Temporary harness: renders the site at an exact CSS width so screenshots show a real
     layout viewport. `chrome --headless --window-size` clamps to a minimum and then crops,
     which looks like an overflow bug that is not there. Delete when done. -->
<meta charset="utf-8">
<title>viewport harness</title>
<style>html,body{margin:0;background:#0b0710}#l{font:12px ui-monospace,monospace;color:#9fe;padding:6px 10px}iframe{display:block;border:0;border-top:1px solid #333}</style>
<div id="l"></div>
<script>
  const q=new URLSearchParams(location.search),w=+(q.get('w')||390),h=+(q.get('h')||1500)
  document.getElementById('l').textContent=`layout viewport: ${w} x ${h}`
  const f=document.createElement('iframe');f.width=w;f.height=h;f.src='/';document.body.appendChild(f)
</script>
