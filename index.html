<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <!-- Google looks for these in order and also asks for /favicon.ico by convention. Until now
         only the SVG was declared and no .ico existed, so that request fell through the SPA
         rewrite and came back as the HTML of the home page with a 200 — which a crawler cannot
         read as an image, and which is a worse answer than a plain 404. Google also wants a
         multiple of 48px square; the old icon was 64. -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1A0F26" />

    <!--
      Everything between the og markers below is replaced per-request by api/share.js for
      /team/:slug and /portfolio/:slug, so a shared link to one person or one project previews
      with their own picture and text. The markers are load-bearing: do not rename or remove them.

      Why a server function and not React: link previews are built by crawlers (WhatsApp,
      Facebook, X, Telegram, LinkedIn) that fetch the HTML and never run JavaScript. Meta tags
      written at runtime by a component are invisible to every one of them — which is why the
      tags below are real HTML, and why the per-page ones are injected before the response is
      sent rather than after the app boots.
    -->
    <!--og-->
    <title>NGP TechWorld — نبني مستقبلك الرقمي</title>
    <meta name="description" content="NGP TechWorld شركة برمجيات وحلول تقنية: تطوير مواقع وتطبيقات، تصميم UI/UX، أنظمة ERP/CRM، حلول سحابية وذكاء اصطناعي. نحوّل أفكارك إلى منتجات رقمية متكاملة." />
    <link rel="canonical" href="https://www.ngptechworld.com/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="NGP TechWorld" />
    <meta property="og:title" content="NGP TechWorld — نبني مستقبلك الرقمي" />
    <meta property="og:description" content="شركة برمجيات وحلول تقنية — مواقع، تطبيقات، أنظمة، وذكاء اصطناعي." />
    <meta property="og:url" content="https://www.ngptechworld.com/" />
    <meta property="og:image" content="https://www.ngptechworld.com/assets/og-cover.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="NGP TechWorld — نبني مستقبلك الرقمي" />
    <meta property="og:locale" content="ar_AR" />
    <meta property="og:locale:alternate" content="en_US" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="NGP TechWorld — نبني مستقبلك الرقمي" />
    <meta name="twitter:description" content="شركة برمجيات وحلول تقنية — مواقع، تطبيقات، أنظمة، وذكاء اصطناعي." />
    <meta name="twitter:image" content="https://www.ngptechworld.com/assets/og-cover.jpg" />
    <!--/og-->

    <meta name="author" content="NGP TechWorld" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- The API serves every image on the site; warming the connection saves a round trip on the
         first card that renders. -->
    <link rel="preconnect" href="https://api.ngptechworld.com" crossorigin>
    <!-- Montserrat is here for Russian alone: Poppins ships no Cyrillic, so ru would drop to
         whatever the operating system picked and stop looking like the rest of the site. Google
         Fonts splits each family by unicode-range, so nobody reading the other nine languages
         downloads it. -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Cairo:wght@400;500;600;700;800&family=Montserrat:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "NGP TechWorld",
        "alternateName": "إن جي بي تك وورلد",
        "url": "https://www.ngptechworld.com/",
        "logo": "https://www.ngptechworld.com/assets/ngp-logo-white.png",
        "image": "https://www.ngptechworld.com/assets/og-cover.jpg",
        "slogan": "نبني مستقبلك الرقمي",
        "description": "شركة برمجيات وحلول تقنية: تطوير مواقع وتطبيقات، تصميم UI/UX، أنظمة ERP/CRM، حلول سحابية وذكاء اصطناعي.",
        "email": "info@ngptechworld.com",
        "address": { "@type": "PostalAddress", "addressLocality": "دمشق", "addressCountry": "SY" },
        "sameAs": []
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "NGP TechWorld",
        "url": "https://www.ngptechworld.com/",
        "inLanguage": ["ar", "en"]
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
